# Azahar Duo Enhanced: builds the signed ARM64 Android APK for this fork.
# - Push to a duo/** branch or run manually: APK is attached to the workflow run as an artifact.
# - Run manually with a release version (or push a duo/v* tag): the APK is also published as a
#   GitHub Release for direct download.
# Signing credentials come only from repository secrets and are never echoed.

name: duo-android

on:
  push:
    branches: [ "duo/**" ]
    tags: [ "duo/v*" ]
  workflow_dispatch:
    inputs:
      release_version:
        description: "Publish a release with this version (for example 0.1.0). Leave empty for a test build."
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: duo-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_COMPILERCHECK: content
      CCACHE_SLOPPINESS: time_macros
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - name: Check signing secrets are configured
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS }}
        run: |
          missing=0
          for name in ANDROID_KEYSTORE_B64 ANDROID_KEY_ALIAS ANDROID_KEYSTORE_PASS; do
            if [ -z "${!name}" ]; then
              echo "::error::Repository secret $name is not set. See duo/docs/BUILD.md."
              missing=1
            fi
          done
          exit $missing
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up cache
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ${{ env.CCACHE_DIR }}
          key: duo-android-${{ github.sha }}
          restore-keys: |
            duo-android-
      - name: Install tools
        run: |
          sudo apt-get update -y
          sudo apt-get install ccache -y
          echo "y" | ${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager "cmake;3.30.3" > /dev/null
      - name: Build and verify signed ARM64 APK
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS }}
          DUO_RELEASE_VERSION: ${{ inputs.release_version }}
        run: ./duo/ci/build-android.sh
      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: azahar-duo-enhanced-apk
          path: duo-artifacts/
          if-no-files-found: error
      - name: Publish GitHub Release
        if: ${{ github.ref_type == 'tag' || inputs.release_version != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          DUO_RELEASE_VERSION: ${{ inputs.release_version }}
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            version="${GITHUB_REF_NAME#duo/v}"
          else
            version="$DUO_RELEASE_VERSION"
          fi
          notes="duo/docs/release-notes/${version}.md"
          if [ ! -f "$notes" ]; then notes="duo/CHANGELOG.md"; fi
          gh release create "duo/v${version}" duo-artifacts/* \
            --target "$GITHUB_SHA" \
            --title "Azahar Duo Enhanced ${version}" \
            --notes-file "$notes" \
            --prerelease
